<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#070614" />
  <meta name="format-detection" content="telephone=no" />
  <title>Aether Rush</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%070614'/%3E%3Ccircle cx='32' cy='32' r='14' fill='%2300f0ff'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%23fff'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-root">
    <canvas id="c"></canvas>

    <div id="hud" hidden>
      <div class="hud-chip">
        <span class="hud-label">SCORE</span>
        <span id="score">0</span>
      </div>
      <div class="hud-chip">
        <span class="hud-label">BEST</span>
        <span id="best">0</span>
      </div>
    </div>

    <div id="overlay">
      <div id="title-screen" class="panel">
        <p class="kicker">3D LANE RUNNER</p>
        <h1>AETHER<br>RUSH</h1>
        <p class="tagline">Collect the orbs. Dodge the gates.<br>How far can you fly?</p>
        <button id="btn-play" class="cta" type="button">PLAY</button>
        <p class="help">
          <span class="help-mobile">Swipe left or right to change lanes. Swipe up or tap JUMP to hop.</span>
          <span class="help-desktop">Arrow keys or A/D to change lanes. Space or ↑ to jump.</span>
        </p>
      </div>
      <div id="gameover-screen" class="panel" hidden>
        <p class="kicker">SIGNAL LOST</p>
        <h2>GAME OVER</h2>
        <p class="final-line">Score <strong id="final-score">0</strong></p>
        <p class="final-best" id="new-best" hidden>New best run</p>
        <button id="btn-retry" class="cta" type="button">PLAY AGAIN</button>
      </div>
    </div>

    <div id="controls" hidden>
      <div class="lane-btns">
        <button id="btn-left" type="button" aria-label="Move left">‹</button>
        <button id="btn-right" type="button" aria-label="Move right">›</button>
      </div>
      <button id="btn-jump" type="button" aria-label="Jump">JUMP</button>
    </div>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
